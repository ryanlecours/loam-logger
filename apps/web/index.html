  <title>Loam Logger | Mountain bike service tracker</title>
  <!--
    This head is static and serves every route of the single-page app, so it
    carries only site-wide defaults. Per-route title, description and
    canonical are set at runtime by usePageMeta on the public pages, and the
    landing page's structured data is rendered by SiteJsonLd so it is
    prerendered on "/" alone. A static canonical is deliberately absent: it
    would claim every route as the homepage. Crawlers that skip JavaScript
    therefore see these defaults on every path; only "/" has prerendered
    body content.
  -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved === 'light' || saved === 'dark' ? saved : (prefersDark ? 'dark' : 'light');
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
