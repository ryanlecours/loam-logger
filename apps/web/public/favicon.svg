<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Loam Logger">
  <title>Loam Logger mark — small</title>

  <!-- Field: obsidian. For favicons and avatars, which crop to a circle on
       most platforms, so the mark runs tighter to centre than the full icon. -->
  <rect width="64" height="64" fill="#0C0C0E"/>

  <g transform="translate(32 31.25) scale(1.02) translate(-32 -31.25)">

    <!-- Same silhouette, one flat mint fill: no facet, no gradient. Two greens
         a step apart are indistinguishable at 32px and only muddy the edge. -->
    <path d="M11 32.5 L26 8 L34.5 22 L41 15.5 L53 32.5 L32 39.5 Z" fill="#9CB0A4"/>

    <!-- Spread, cream. Gutter widened 2u to 3u so it survives as a full pixel
         at 32px; no ruled lines, no cover edge. -->
    <path d="M8 34 L30.5 41.3 L30.5 54.5 L8 47 Z" fill="#FAF8F4"/>
    <path d="M56 34 L33.5 41.3 L33.5 54.5 L56 47 Z" fill="#FAF8F4"/>

  </g>
</svg>
