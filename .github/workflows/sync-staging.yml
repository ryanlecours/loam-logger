name: Sync staging with main

# After anything lands on main, bring staging up to it. Migration PRs go into
# staging first (see CLAUDE.md), and a staging that lags main makes their
# diffs show main's commits as if they were part of the change.
#
# - staging has nothing of its own: fast-forward it to main.
# - staging holds work not yet promoted (a migration waiting for its
#   staging -> main PR): merge main in, so that work is never dropped.
# - the merge conflicts: fail the job and leave staging alone for a person
#   to resolve.
# Nothing is ever force-pushed. A conflict also opens (or reuses) an issue,
# so it does not hide in a failed Actions run, and the next sync that leaves
# staging containing main closes that issue again.
#
# Token: the push uses the STAGING_SYNC_TOKEN secret, a fine-grained PAT for
# this repo with Contents and Workflows set to read and write. GITHUB_TOKEN
# cannot carry the Workflows permission, so GitHub refuses any push of it
# that brings a change under .github/workflows/ onto staging. Without the
# secret the job falls back to GITHUB_TOKEN and those runs fail; sync them by
# hand. Pushes made with the PAT start ci.yml on staging; GITHUB_TOKEN pushes
# do not. Railway's staging service deploys either way, since it listens to
# GitHub directly.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-staging
  cancel-in-progress: false

jobs:
  sync:
    name: Sync staging with main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
          token: ${{ secrets.STAGING_SYNC_TOKEN || github.token }}

      - name: Bring staging up to main
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "staging already contains main; nothing to do."
            exit 0
          fi

          if git merge-base --is-ancestor HEAD origin/main; then
            echo "Fast-forwarding staging to main."
            git merge --ff-only origin/main
          else
            echo "staging has commits main lacks:"
            git log --oneline origin/main..HEAD
            if ! git merge --no-ff origin/main -m "Merge main into staging (automatic sync)"; then
              git merge --abort
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              echo "::error::main does not merge cleanly into staging. Merge it by hand."
              exit 1
            fi
          fi

          # A plain push: it is refused, never forced, if staging moved meanwhile.
          git push origin HEAD:staging
          echo "staging is now $(git rev-parse --short HEAD)."

      - name: Open an issue for the conflict
        if: failure() && steps.sync.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="staging needs a manual merge of main"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          body="main ($(git rev-parse --short origin/main)) does not merge cleanly into staging. Merge it by hand, then close this issue. Run: $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close the conflict issue once staging contains main
        # Runs on every successful sync, including the "nothing to do" exit,
        # so an issue left open after someone merged by hand is closed too.
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="staging needs a manual merge of main"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            echo "No open conflict issue."
            exit 0
          fi
          gh issue close "$existing" --comment "staging contains main again ($(git rev-parse --short HEAD)). Closed by the sync run: $RUN_URL"
          echo "Closed #$existing."
